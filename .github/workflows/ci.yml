name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export map source for branch patch
        if: github.head_ref == 'agent/exposure-focus-experience-guide' || github.ref == 'refs/heads/agent/exposure-focus-experience-guide'
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-map-source
          path: src/map/OpportunityMap.tsx
          if-no-files-found: error
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Build GitHub Pages target
        run: npm run build -- --mode pages

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Release phase prefix. Update in one place when the product graduates
      # (Alpha -> Beta -> Release Candidate -> General Availability).
      RELEASE_PHASE: Alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Compute release version
        id: version
        # Version = <major.minor from package.json>.<monotonic build number>.
        # Bump package.json's major/minor for milestones; the build number
        # guarantees every release is unique and ordered.
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")"
          VERSION="${BASE_VERSION}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_PHASE} Release ${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Package release files
        id: package
        run: |
          BUILD_ZIP="${{ github.event.repository.name }}_build-v${{ steps.version.outputs.version }}.zip"
          SOURCE_ZIP="${{ github.event.repository.name }}_source-v${{ steps.version.outputs.version }}.zip"
          (cd dist && zip -r "../$BUILD_ZIP" .)
          zip -r "$SOURCE_ZIP" . -x '.git/*' 'node_modules/*' 'dist/*' '*.tsbuildinfo' 'tests/*'
          echo "build_zip=$BUILD_ZIP" >> "$GITHUB_OUTPUT"
          echo "source_zip=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.build_zip }}
            ${{ steps.package.outputs.source_zip }}
