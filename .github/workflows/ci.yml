name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Package release files
        id: package
        run: |
          BUILD_ZIP="${{ github.event.repository.name }}_build-${{ github.run_number }}.zip"
          SOURCE_ZIP="${{ github.event.repository.name }}_source-${{ github.run_number }}.zip"
          (cd dist && zip -r "../$BUILD_ZIP" .)
          zip -r "$SOURCE_ZIP" . -x '.git/*' 'node_modules/*' 'dist/*' '*.tsbuildinfo' 'tests/*'
          echo "build_zip=$BUILD_ZIP" >> "$GITHUB_OUTPUT"
          echo "source_zip=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Opportunity Lab build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.build_zip }}
            ${{ steps.package.outputs.source_zip }}
