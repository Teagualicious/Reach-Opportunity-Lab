name: Apply product handoff patch

on:
  push:
    branches:
      - agent/map-clarity-sales-workspace-v2
    paths:
      - .github/workflows/apply-product-handoff-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/map-clarity-sales-workspace-v2

      - name: Synchronize status and architecture handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          status = read('STATUS.md').replace('Market Growth Studio', 'Seller Growth Studio')
          release_line = '- Standardized the release format: releases publish as `<Phase> Release <MAJOR.MINOR>.<build>` (e.g. `Alpha Release 0.1.312`) with tag `v<MAJOR.MINOR>.<build>`; phase lives in one `RELEASE_PHASE` env value in `ci.yml`, major/minor comes from `package.json`, and the build number is the monotonic CI run number. Convention documented in `BUILD_HANDOFF.md`.'
          additions = '''
- Tightened the expanded desktop shell to narrower sidebars and denser panel spacing while preserving the optimized compact/mobile layout contract.
- Strengthened reach-gap, competitor, selected-ZIP, and campaign paint so enabled layers remain legible over the pastel opportunity surface.
- Added ZIP-level competitive intelligence to Opportunity Explorer, including modeled competitor intersections, reach-gap status, and detail-card controls that toggle each footprint layer.
- Renamed the internal experience to Seller Growth Studio and replaced the duplicate ranked-ZIP presentation with a deterministic synthetic prospect/account action queue.
- Added the pure `sellerOpportunity` domain model and tests so entity type, urgency, evidence, and recommended next action remain deterministic and independent from React/MapLibre.
'''.strip()
          if additions.splitlines()[0] not in status:
              if release_line not in status:
                  raise SystemExit('STATUS release anchor not found')
              status = status.replace(release_line, release_line + '\n' + additions)

          next_block = '''## Next up

1. Merge the map-clarity and Seller Growth Studio differentiation pass, then review the stable Pages build on the target laptop.
2. Tune panel widths and typography only if the real-browser review still feels crowded.
3. Extend current-campaign, reach-gap, competitor, and recommended-expansion comparison controls through Client Growth Studio.
4. Expand Seller Growth Studio with richer synthetic account histories, prospect lists, and retention-save comparisons.
5. Add additional state/major-city market packages behind the same territory/market contracts.
6. Add the guided executive tour and remaining compact-mode polish.
7. Add automated WebGL visual regression coverage for standard and offline adapters.

## Decisions log'''
          status, count = re.subn(r'## Next up\n.*?## Decisions log', next_block, status, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('STATUS next-up block not found')

          decision = '''- 2026-07-16 | DECISION: Opportunity Explorer is the neutral diagnostic experience and Seller Growth Studio is the internal action workflow
  Considered: keeping both as ZIP-ranking views with different score transforms, combining them into one screen, and separating market diagnosis from seller action
  Rejected because: duplicate map experiences confuse executive users and do not tell a distinct internal-sales story; one combined screen would mix diagnosis with account/prospect workflow
  Must preserve: Explorer answers where/why/competitive context; Seller Growth answers who to pursue, grow, or save and what action to take; both may share geography and domain signals without sharing product ownership

'''
          if decision.splitlines()[0] not in status:
              status = status.replace('## Noticed', decision + '## Noticed')
          write('STATUS.md', status)

          architecture = read('ARCHITECTURE.md').replace('Market Growth Studio', 'Seller Growth Studio')
          architecture = architecture.replace(
              '- recommendations and explanations\n',
              '- recommendations and explanations\n- deterministic seller opportunity/action queue generation\n',
          )
          architecture = architecture.replace(
              'All three current features consume the same territory selection and statewide market data.',
              'All three current features consume the same territory selection and statewide market data, but product ownership remains distinct: Explorer diagnoses markets, Client Growth models advertiser strategy, and Seller Growth prioritizes internal account/prospect actions.',
          )
          architecture = architecture.replace(
              '- applying domain-provided scores\n',
              '- applying domain-provided scores\n- rendering stronger typed reach-gap and competitor evidence layers\n',
          )
          architecture = architecture.replace(
              '  domain/              opportunities, territories, scoring, simulation, overlays\n',
              '  domain/              opportunities, territories, scoring, seller actions, simulation, overlays\n',
          )
          write('ARCHITECTURE.md', architecture)

          handoff = read('BUILD_HANDOFF.md').replace('Market Growth Studio', 'Seller Growth Studio')
          handoff = handoff.replace(
              '    marketMode.ts\n',
              '    marketMode.ts\n    sellerOpportunity.ts        deterministic internal prospect/account action items\n',
          )
          distinction = '''
## Product-experience distinction

- **Opportunity Explorer** owns neutral ZIP diagnosis: opportunity score, drivers/limiters, market context, reach-gap status, and modeled competitor intersections. Selecting a competitor in ZIP details toggles the same typed map footprint layer.
- **Client Growth Studio** owns a single advertiser scenario and deterministic strategy simulation.
- **Seller Growth Studio** owns the internal action queue. It converts objective-specific ZIP scores into deterministic synthetic prospects/accounts with entity type, urgency, evidence, and recommended seller action; the map is supporting geographic evidence rather than the final answer.

Do not reduce Seller Growth Studio back to a differently recolored ZIP ranking. Shared geography and score transforms are inputs, not the product workflow.

'''
          if '## Product-experience distinction' not in handoff:
              handoff = handoff.replace('## 5. Map implementation', distinction + '## 5. Map implementation')
          handoff = handoff.replace(
              '- inactive boundaries are muted gray;\n',
              '- inactive boundaries are muted gray;\n- enabled reach-gap and competitor footprints use high-contrast fills and outlines;\n',
          )
          handoff = handoff.replace(
              '- map calls `resize()` and refits after sidebar changes.\n',
              '- map calls `resize()` and refits after sidebar changes;\n- expanded desktop panel widths remain deliberately narrow so the map is the dominant surface.\n',
          )
          write('BUILD_HANDOFF.md', handoff)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-product-handoff-patch.yml
          git config user.name "Opportunity Lab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add STATUS.md ARCHITECTURE.md BUILD_HANDOFF.md .github/workflows/apply-product-handoff-patch.yml
          git commit -m "Synchronize seller workflow documentation"
          git push origin HEAD:agent/map-clarity-sales-workspace-v2
