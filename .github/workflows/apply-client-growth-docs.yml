# One-time branch workflow; removes itself after synchronizing documentation.
name: Apply Client Growth documentation patch

on:
  push:
    branches:
      - agent/client-growth-overlays-v2
    paths:
      - .github/workflows/apply-client-growth-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-growth-overlays-v2

      - name: Synchronize product documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
            if old not in text:
              raise SystemExit(f'{label} anchor not found')
            return text.replace(old, new, 1)

          readme = Path('README.md').read_text()
          readme = replace_once(
            readme,
            '- **Client Growth Studio** — advertiser strategy workspace: fictional Lakefront Automotive footprint, selectable strategies, deterministic simulation, territory-specific expansion ZIPs, current-versus-modeled results, and conceptual Architect handoff.',
            '- **Client Growth Studio** — advertiser geographic-planning workspace: a three-step Current plan → Diagnose gaps → Recommended plan flow with current footprint, modeled reach gaps, competitor pressure, deterministic strategy simulation, explained expansion ZIPs, trade-offs, and conceptual Architect handoff.',
            'README Client Growth bullet',
          )
          Path('README.md').write_text(readme)

          status = Path('STATUS.md').read_text()
          anchor = '- Added ZIP-level modeled competitive intelligence to Opportunity Explorer, including modeled competitor intersections, reach-gap status, and detail-card controls that toggle each footprint layer.'
          additions = '''- Expanded Client Growth Studio into a three-step geographic planning workflow: Current plan, Diagnose gaps, and Recommended plan.
- Added pure deterministic `clientGeography` planning and tests for current footprint, reach-gap detection, competitor-pressure intersections, ranked expansion candidates, and recommendation explanations.
- Added typed `recommended` MapLibre feature state so current campaign ZIPs remain cyan while recommended expansion ZIPs render independently in green without statewide geometry re-upload.
- Added dynamic reach-gap filters, plan-view controls, selected-ZIP campaign context, recommended ZIP explanations, and explicit strategy trade-offs.
'''.strip()
          if additions.splitlines()[0] not in status:
            status = replace_once(status, anchor, anchor + '\n' + additions, 'STATUS completed-work')
          status = re.sub(
            r'## Next up\n.*?## Decisions log',
            '''## Next up

1. Merge and visually review the Client Growth geographic-planning workflow through the stable Pages URL.
2. Refine Client Growth recommended-ZIP ordering and map legend only if real-browser review exposes ambiguity.
3. Add richer synthetic advertiser profiles and allow switching between multiple client scenarios.
4. Expand Seller Growth Studio with account histories, prospect lists, and retention-save comparisons.
5. Add additional state/major-city market packages behind the current market contracts.
6. Add the guided executive tour and remaining compact-mode polish.
7. Add automated WebGL visual regression coverage for standard and offline adapters.

## Decisions log''',
            status,
            count=1,
            flags=re.S,
          )
          decision = '''- 2026-07-16 | DECISION: Client Growth tells a three-step geographic planning story
  Considered: keeping one campaign layer throughout simulation, showing all diagnostic overlays simultaneously, and separating current, diagnostic, and recommended views
  Rejected because: one undifferentiated map cannot explain what changed, while always-on overlays create visual noise and weaken the executive narrative
  Must preserve: current ZIPs, reach gaps/competitor evidence, and recommended ZIPs remain distinct typed states; the simulation advances to the recommended view; geographic recommendations remain deterministic domain output

'''
          if decision.splitlines()[0] not in status:
            status = status.replace('## Noticed', decision + '## Noticed')
          Path('STATUS.md').write_text(status)

          architecture = Path('ARCHITECTURE.md').read_text()
          architecture = replace_once(
            architecture,
            '- deterministic client strategies and simulations\n',
            '- deterministic client strategies and simulations\n- deterministic client geographic planning and expansion recommendations\n',
            'ARCHITECTURE domain responsibility',
          )
          architecture = replace_once(
            architecture,
            '- baseline campaign footprint\n- selectable deterministic strategies\n- current-versus-modeled results\n- territory-aware expansion ZIPs\n- conceptual Architect handoff',
            '- three-step Current plan → Diagnose gaps → Recommended plan workflow\n- baseline campaign footprint\n- selectable deterministic strategies\n- deterministic reach-gap, competitor-pressure, and expansion analysis\n- distinct current and recommended ZIP feature states\n- current-versus-modeled results and strategy trade-offs\n- conceptual Architect handoff',
            'ARCHITECTURE Client Growth ownership',
          )
          Path('ARCHITECTURE.md').write_text(architecture)

          handoff = Path('BUILD_HANDOFF.md').read_text()
          handoff = replace_once(
            handoff,
            '    clientScenario.ts\n',
            '    clientScenario.ts\n    clientGeography.ts          deterministic campaign diagnostics and ZIP expansion plan\n',
            'BUILD_HANDOFF source map',
          )
          client_section = '''### Client Growth Studio

Client Growth owns a single fictional advertiser scenario and now presents a three-step map story:

1. **Current plan** — active campaign ZIPs use cyan campaign state.
2. **Diagnose gaps** — dynamic reach-gap ZIPs and typed competitor layers become visible.
3. **Recommended plan** — current ZIPs remain cyan and deterministic expansion ZIPs use green `recommended` feature state.

`clientGeography.ts` owns reach-gap detection, competitor intersection counts, expansion candidate scoring, reasons, and recommended ZIP count. React owns plan-view state and simulation theater only. MapLibre renders supplied ZIP sets and never chooses recommendations.

The simulation automatically moves to Recommended plan when complete. Selecting a recommended ZIP zooms to its official geometry and reveals campaign role, reach-gap state, and competitor count.

'''
          if 'Client Growth owns a single fictional advertiser scenario and now presents' not in handoff:
            handoff = replace_once(handoff, '### Client Growth Studio\n', client_section, 'BUILD_HANDOFF Client Growth section')
          handoff = replace_once(
            handoff,
            '| `campaign` | current/recommended campaign emphasis |',
            '| `campaign` | current campaign footprint emphasis |\n| `recommended` | proposed client expansion ZIP emphasis |',
            'BUILD_HANDOFF feature-state table',
          )
          Path('BUILD_HANDOFF.md').write_text(handoff)
          PY

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-client-growth-docs.yml
          git config user.name "Opportunity Lab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md STATUS.md ARCHITECTURE.md BUILD_HANDOFF.md .github/workflows/apply-client-growth-docs.yml
          git commit -m "Document Client Growth geographic planning"
          git push origin HEAD:agent/client-growth-overlays-v2
