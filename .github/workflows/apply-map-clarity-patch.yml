name: Apply map clarity patch

on:
  push:
    branches:
      - agent/map-clarity-sales-workspace-v2
    paths:
      - .github/workflows/apply-map-clarity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/map-clarity-sales-workspace-v2

      - name: Strengthen overlay paint without replacing map engine
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/map/OpportunityMap.tsx')
          text = path.read_text()
          replacements = {
              "'fill-opacity': 0.1,": "'fill-opacity': 0.24,",
              "'line-color': '#7c3aed',": "'line-color': '#c026d3',",
              "'line-width': 2.2,": "'line-width': 3,\n          'line-opacity': 0.98,",
              "'fill-opacity': competitor.wide ? 0.035 : 0.08,": "'fill-opacity': competitor.wide ? 0.11 : 0.2,",
              "'line-width': competitor.wide ? 1.1 : 1.9,": "'line-width': competitor.wide ? 2 : 2.8,\n            'line-opacity': 0.96,",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-map-clarity-patch.yml
          git config user.name "Opportunity Lab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/map/OpportunityMap.tsx .github/workflows/apply-map-clarity-patch.yml
          git commit -m "Strengthen supporting map overlay paint"
          git push origin HEAD:agent/map-clarity-sales-workspace-v2
