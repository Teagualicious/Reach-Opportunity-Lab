name: Apply client map state patch

on:
  push:
    branches:
      - agent/client-growth-overlays-v2
    paths:
      - .github/workflows/apply-client-map-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-growth-overlays-v2

      - name: Add recommended and dynamic reach-gap map state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/map/OpportunityMap.tsx')
          text = path.read_text()

          replacements = [
            (
              "  campaignZips?: readonly string[];\n  displayScores?: Readonly<Record<string, number>>;\n  showReachGap?: boolean;",
              "  campaignZips?: readonly string[];\n  recommendedZips?: readonly string[];\n  displayScores?: Readonly<Record<string, number>>;\n  showReachGap?: boolean;\n  reachGapZips?: readonly string[];",
            ),
            (
              "type ZipFlagStateKey = 'dim' | 'campaign' | 'territoryDim';",
              "type ZipFlagStateKey = 'dim' | 'campaign' | 'recommended' | 'territoryDim';",
            ),
            (
              "  campaignZips = [],\n  displayScores,\n  showReachGap = false,",
              "  campaignZips = [],\n  recommendedZips = [],\n  displayScores,\n  showReachGap = false,\n  reachGapZips,",
            ),
            (
              "  const campaignZipSet = useMemo(() => new Set(campaignZips), [campaignZips]);\n  const territoryDimmedZips = useMemo(",
              "  const campaignZipSet = useMemo(() => new Set(campaignZips), [campaignZips]);\n  const recommendedZipSet = useMemo(() => new Set(recommendedZips), [recommendedZips]);\n  const effectiveReachGapZips = useMemo(\n    () => reachGapZips ?? data.overlays.reachGapZips,\n    [data.overlays.reachGapZips, reachGapZips],\n  );\n  const territoryDimmedZips = useMemo(",
            ),
            (
              "  const campaignZipSetRef = useRef(campaignZipSet);\n  const territoryDimmedZipsRef = useRef(territoryDimmedZips);",
              "  const campaignZipSetRef = useRef(campaignZipSet);\n  const recommendedZipSetRef = useRef(recommendedZipSet);\n  const reachGapZipsRef = useRef<readonly string[]>(effectiveReachGapZips);\n  const territoryDimmedZipsRef = useRef(territoryDimmedZips);",
            ),
            (
              "  const appliedCampaignRef = useRef<ReadonlySet<string>>(new Set());\n  const appliedTerritoryDimmedRef",
              "  const appliedCampaignRef = useRef<ReadonlySet<string>>(new Set());\n  const appliedRecommendedRef = useRef<ReadonlySet<string>>(new Set());\n  const appliedTerritoryDimmedRef",
            ),
            (
              "    appliedCampaignRef.current = new Set();\n    appliedTerritoryDimmedRef.current = new Set();",
              "    appliedCampaignRef.current = new Set();\n    appliedRecommendedRef.current = new Set();\n    appliedTerritoryDimmedRef.current = new Set();",
            ),
            (
              "        filter: zipMembershipFilter(data.overlays.reachGapZips),",
              "        filter: zipMembershipFilter(reachGapZipsRef.current),",
            ),
            (
              "      appliedCampaignRef.current = syncZipFlagState(map, appliedCampaignRef.current, campaignZipSetRef.current, 'campaign');\n      appliedTerritoryDimmedRef.current",
              "      appliedCampaignRef.current = syncZipFlagState(map, appliedCampaignRef.current, campaignZipSetRef.current, 'campaign');\n      appliedRecommendedRef.current = syncZipFlagState(\n        map,\n        appliedRecommendedRef.current,\n        recommendedZipSetRef.current,\n        'recommended',\n      );\n      appliedTerritoryDimmedRef.current",
            ),
            (
              "  useEffect(() => {\n    territoryZipSetRef.current = territoryZipSet;",
              "  useEffect(() => {\n    recommendedZipSetRef.current = recommendedZipSet;\n    const map = mapRef.current;\n    if (!map?.getSource(SOURCE_ID)) return;\n    appliedRecommendedRef.current = syncZipFlagState(\n      map,\n      appliedRecommendedRef.current,\n      recommendedZipSet,\n      'recommended',\n    );\n  }, [recommendedZipSet]);\n\n  useEffect(() => {\n    territoryZipSetRef.current = territoryZipSet;",
            ),
            (
              "  useEffect(() => {\n    showReachGapRef.current = showReachGap;",
              "  useEffect(() => {\n    reachGapZipsRef.current = effectiveReachGapZips;\n    const map = mapRef.current;\n    if (!map?.getSource(SOURCE_ID)) return;\n    const filter = zipMembershipFilter(effectiveReachGapZips);\n    if (map.getLayer(REACH_GAP_FILL_LAYER_ID)) map.setFilter(REACH_GAP_FILL_LAYER_ID, filter);\n    if (map.getLayer(REACH_GAP_LINE_LAYER_ID)) map.setFilter(REACH_GAP_LINE_LAYER_ID, filter);\n  }, [effectiveReachGapZips]);\n\n  useEffect(() => {\n    showReachGapRef.current = showReachGap;",
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Patch anchor not found: {old[:80]}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-client-map-state.yml
          git config user.name "Opportunity Lab Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/map/OpportunityMap.tsx .github/workflows/apply-client-map-state.yml
          git commit -m "Add recommended client map state"
          git push origin HEAD:agent/client-growth-overlays-v2
