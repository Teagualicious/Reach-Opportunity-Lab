name: Generate ZCTA fixture

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - scripts/build-zcta-fixture.mjs
      - .github/workflows/generate-zcta-fixture.yml
      - public/data/zip-opportunities.json

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Cleveland–Akron ZCTA fixture
        run: node scripts/build-zcta-fixture.mjs

      - name: Upload generated fixture for review
        uses: actions/upload-artifact@v4
        with:
          name: cleveland-akron-zcta-2020
          path: |
            public/data/cleveland-akron-zcta-2020.geojson
            public/data/cleveland-akron-zcta-2020.provenance.json
          if-no-files-found: error
          retention-days: 7
