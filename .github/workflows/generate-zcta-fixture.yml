name: Generate ZCTA fixture

on:
  workflow_dispatch:
  push:
    branches:
      - agent/checked-in-zcta-geometry
    paths:
      - scripts/build-zcta-fixture.mjs
      - .github/workflows/generate-zcta-fixture.yml
      - public/data/zip-opportunities.json

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/checked-in-zcta-geometry

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build checked-in Cleveland–Akron ZCTA fixture
        run: node scripts/build-zcta-fixture.mjs

      - name: Commit generated fixture
        run: |
          if git diff --quiet -- public/data/cleveland-akron-zcta-2020.geojson public/data/cleveland-akron-zcta-2020.provenance.json; then
            echo "ZCTA fixture is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cleveland-akron-zcta-2020.geojson public/data/cleveland-akron-zcta-2020.provenance.json
          git commit -m "Generate checked-in Cleveland ZCTA fixture"
          git push origin HEAD:agent/checked-in-zcta-geometry
